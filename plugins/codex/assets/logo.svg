<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="relay-bg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="relay-accent" x1="26" y1="32" x2="102" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="relay-return" x1="102" y1="92" x2="26" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#relay-bg)" stroke="#312E81" stroke-width="2"/>
  <!-- Outbound capsule arc (top-left to right) -->
  <path d="M32 48 C32 34, 44 28, 60 28 H84" stroke="url(#relay-accent)" stroke-width="10" stroke-linecap="round"/>
  <path d="M74 18 L88 28 L74 38" stroke="#6366F1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Return verified arc (bottom-right to left) -->
  <path d="M96 80 C96 94, 84 100, 68 100 H44" stroke="url(#relay-return)" stroke-width="10" stroke-linecap="round"/>
  <path d="M54 90 L40 100 L54 110" stroke="#22D3EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bounded capsule core node -->
  <rect x="48" y="48" width="32" height="32" rx="10" fill="#0F172A" stroke="url(#relay-accent)" stroke-width="4"/>
  <circle cx="64" cy="64" r="6" fill="#22D3EE"/>
</svg>
