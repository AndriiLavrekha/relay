name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit & integration tests
        run: npm test

      - name: Run cross-provider smoke suite
        run: npm run smoke

      - name: Verify generated plugin bundles & skills are synchronized
        shell: bash
        run: npm run bundle:plugins && git diff --exit-code -- plugins skills

      - name: Verify npm package contents
        run: npm pack --dry-run
